name: Pet previews

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate pet assets and README files
        run: |
          npm run previews
          npm run readmes

      - name: Validate repository
        run: |
          npm run validate
          npm run lint

      - name: Commit generated files on main
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/zh-CN/README.md assets/previews
          git diff --cached --quiet || git commit -m "chore: update generated previews and readmes"
          git push

      - name: Check generated files are committed on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code

      - name: Upload generated previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pet-previews
          path: assets/previews/
