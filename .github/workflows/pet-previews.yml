name: Pet previews

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate pet previews
        run: npm run previews

      - name: Validate repository
        run: |
          npm run validate
          npm run lint

      - name: Check generated previews are committed
        run: git diff --exit-code

      - name: Upload generated previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pet-previews
          path: assets/previews/
